    targets:
      web:
        at: /e/control-inventory
        do:
          - check: { role: checkbox, name: Agree to terms, within: Toggles }
          - check: { role: radio, name: Medium, within: Size }
        expect:
          shows:
            - { role: status, name: Toggles state, text: "terms agreed, size Medium" }
            - { role: checkbox, name: Agree to terms, states: [ checked ] }
            - { role: radio, name: Medium, states: [ checked ] }
          gone:
            - { role: status, name: Toggles state, text: "terms not agreed, size unset" }
            - { role: checkbox, name: Agree to terms }
            - { role: radio, name: Medium }
