# Replay recording of one e2e test. Review it like code: each step lists what
# a replay does (do) and what it checks before the step passes (expect).
# Don't edit it: scenarios-act-completes-drag-and-drop.lock.json holds each recording's key and digest,
# so an edited recording no longer replays. Record it again instead.

test: act completes drag-and-drop
file: tests-agent/scenarios.e2e.ts

steps:
  - act: "Complete this scenario as the page instructs: drag the right items into the dropzone in the order the page asks for"
    targets:
      web:
        at: /e/drag-and-drop
        do:
          - drag: { text: Banana, testId: drag-banana }
            to: { testId: dropzone }
          - drag: { text: Cherry, testId: drag-cherry }
            to: { testId: dropzone }
        expect:
          shows:
            - { text: Items dropped in the right order, testId: success-message }
          gone:
            - { text: Drop items here }
