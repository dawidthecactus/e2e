# Replay recording of one e2e test. Review it like code: each step lists what
# a replay does (do) and what it checks before the step passes (expect).
# Generated, not reviewed: unique-cache-act-adds-an-address-with-a-run-unique-label.lock.json holds the cache keys.

test: act adds an address with a run-unique label
file: tests-agent/unique-cache.e2e.ts

steps:
  - act: add a new address labelled {label} at {line}
    params:
      label: "{{param:/label}}"
      line: 7 Pine Way, Bend
    targets:
      web:
        at: /e/saved-addresses
        do:
          - type: "{{param:/label}}"
            into: { role: textbox, name: Label (e.g. Cabin), testId: label-input, placeholder: Label (e.g. Cabin) }
          - type: 7 Pine Way, Bend
            into: { role: textbox, name: Street address, testId: line-input, placeholder: Street address }
          - tap: { role: button, name: Add address, testId: add-button }
        expect:
          shows:
            - { text: Address saved, testId: toast }
            - { text: "{{param:/label}}" }
            - { role: listitem, name: "{{param:/label}} 7 Pine Way, Bend Delete", testId: address-custom-2 }
            - { text: "7 Pine Way, Bend" }
