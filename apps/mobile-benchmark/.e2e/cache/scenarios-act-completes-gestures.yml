# Replay recording of one e2e test. Review it like code: each step lists what
# a replay does (do) and what it checks before the step passes (expect).
# Generated, not reviewed: scenarios-act-completes-gestures.lock.json holds the cache keys.

test: act completes Gestures
file: tests-agent/scenarios.e2e.ts

steps:
  - act: "Complete this scenario as the screen instructs: long-press the first target, swipe the card left, then double-tap the last target"
    targets:
      android-emulator:
        at: dev.e2e.benchmark
        do:
          - longPress: { role: group, name: Hold me, testId: long-press-target, selector: id=long-press-target, within: Step 1 of 3 }
          - tool: swipe
          - tool: swipe
          - doubleTap: { role: group, name: Double-tap me, testId: double-tap-target, selector: id=double-tap-target, within: Step 3 of 3 }
        expect:
          shows:
            - { role: text, name: All gestures completed, testId: success-message }
          gone:
            - { role: text, name: Step 1 of 3 }
            - { role: text, name: Hold me }
            - { role: group, name: Hold me, testId: long-press-target }
      ios-simulator:
        at: dev.e2e.benchmark / Gestures
        do:
          - longPress: { role: other, name: Hold me, testId: long-press-target, selector: id=long-press-target }
          - tool: swipe
          - tool: swipe
          - tool: swipe
          - doubleTap: { role: other, name: Double-tap me, testId: double-tap-target, selector: id=double-tap-target }
          - doubleTap: { role: other, name: Double-tap me, testId: double-tap-target, selector: id=double-tap-target }
        expect:
          shows:
            - { role: text, name: All gestures completed, testId: success-message }
          gone:
            - { role: other, name: Hold me, testId: long-press-target }
            - { role: text, name: Step 1 of 3 }
