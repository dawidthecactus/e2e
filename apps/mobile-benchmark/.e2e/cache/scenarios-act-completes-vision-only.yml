# Replay recording of one e2e test. Review it like code: each step lists what
# a replay does (do) and what it checks before the step passes (expect).
# Don't edit it: scenarios-act-completes-vision-only.lock.json holds each recording's key and digest,
# so an edited recording no longer replays. Record it again instead.

test: act completes Vision Only
file: tests-agent/scenarios.e2e.ts

steps:
  - act: "Complete this scenario as the screen instructs: complete the flow the screen describes until it says Sequence complete. The screen lists nothing useful; take a screenshot and work from it."
    targets:
      android-emulator:
        at: dev.e2e.benchmark
        do:
          - tapAt: { x: 749, y: 1458 }
            viewport: 1080x2400
          - tapAt: { x: 331, y: 1458 }
            viewport: 1080x2400
          - tapAt: { x: 540, y: 1458 }
            viewport: 1080x2400
        expect:
          shows:
            - { role: text, name: Sequence complete }
          gone:
            - { role: text, name: "Tap: square, then circle, then diamond" }
            - { role: text, name: "Progress: 0/3" }
